<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>笔记登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
        }
        .title {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }
        .input-group {
            margin-bottom: 18px;
        }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #555;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        .login-btn {
            width: 100%;
            padding: 11px;
            background-color: #409eff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .login-btn:hover {
            background-color: #337ecc;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2 class="title">笔记登录</h2>

    <div class="input-group">
        <label>笔记名</label>
        <input type="text" id="noteName" placeholder="请输入笔记名">
    </div>

    <div class="input-group">
        <label>密码</label>
        <input type="password" id="notePwd" placeholder="请输入密码">
    </div>

    <button class="login-btn" onclick="goNote()">登录</button>
</div>

<script>
function goNote() {
    // 获取输入内容
    let name = document.getElementById('noteName').value
    let pwd = document.getElementById('notePwd').value

    // 拼接跳转链接
    let url = 'jiuyi91club.pages.dev/note/' + name + '/' + pwd + '/'

    // 跳转
    window.location.href = url
}
</script>

</body>
</html>

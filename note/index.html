<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>笔记登录</title>
    <style>
        /* 页面整体样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 登录框容器 */
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
        }

        /* 标题 */
        .title {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        /* 输入框组 */
        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #555;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        /* 登录按钮 */
        .login-btn {
            width: 100%;
            padding: 11px;
            background-color: #409eff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: #337ecc;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2 class="title">笔记登录</h2>

        <!-- 笔记名输入框 -->
        <div class="input-group">
            <label>笔记名</label>
            <input type="text" placeholder="请输入笔记名">
        </div>

        <!-- 密码输入框 -->
        <div class="input-group">
            <label>密码</label>
            <input type="password" placeholder="请输入密码">
        </div>

        <!-- 登录按钮 -->
        <button class="login-btn">登录</button>
    </div>

</body>
</html>
